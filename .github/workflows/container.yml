name: Build and deploy bot image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: verification_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          VERIFICATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/verification_test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: track-the-hack-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to Azure Container Registry
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/track-the-hack-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        if: github.ref == 'refs/heads/main'
        with:
          inlineScript: |
            set -euo pipefail
            image="${{ vars.AZURE_ACR_LOGIN_SERVER }}/track-the-hack-bot:${{ github.sha }}"
            if ! az containerapp job show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name track-the-hack-bot-migrate >/dev/null 2>&1; then
              echo "Required migration job track-the-hack-bot-migrate does not exist." >&2
              exit 1
            fi
            az containerapp job update \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name track-the-hack-bot-migrate \
              --image "$image"
            execution="$(az containerapp job start \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name track-the-hack-bot-migrate \
              --query name --output tsv)"
            for attempt in $(seq 1 40); do
              status="$(az containerapp job execution show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name track-the-hack-bot-migrate \
                --job-execution-name "$execution" \
                --query properties.status --output tsv)"
              if [ "$status" = Succeeded ]; then break; fi
              if [ "$status" = Failed ] || [ "$attempt" -eq 40 ]; then
                echo "Migration execution $execution ended with status $status." >&2
                exit 1
              fi
              sleep 15
            done
            az containerapp update \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name track-the-hack-bot \
              --image "$image"
            for job in track-the-hack-bot-embeddings tth-bot-corpus-sync tth-bot-ai-evaluate; do
              az containerapp job update \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "$job" \
                --image "$image" \
                --output none
              job_image="$(az containerapp job show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "$job" \
                --query properties.template.containers[0].image --output tsv)"
              if [ "$job_image" != "$image" ]; then
                echo "Expected $job to use $image, got $job_image." >&2
                exit 1
              fi
            done
            for attempt in $(seq 1 20); do
              revision="$(az containerapp show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name track-the-hack-bot \
                --query properties.latestRevisionName --output tsv)"
              health="$(az containerapp revision show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name track-the-hack-bot --revision "$revision" \
                --query properties.healthState --output tsv)"
              image="$(az containerapp revision show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name track-the-hack-bot --revision "$revision" \
                --query properties.template.containers[0].image --output tsv)"
              if [ "$health" = Healthy ] && [ "$image" = "${{ vars.AZURE_ACR_LOGIN_SERVER }}/track-the-hack-bot:${{ github.sha }}" ]; then break; fi
              echo "Revision $revision is $health; waiting for health (attempt $attempt/20)."
              if [ "$attempt" -eq 20 ]; then
                echo "Expected image ${{ github.sha }}, got $image." >&2
                exit 1
              fi
              sleep 15
            done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - name: Register Discord application commands
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COMMUNITY_GUILD_ID: ${{ vars.COMMUNITY_GUILD_ID }}
          ORGANIZER_GUILD_ID: ${{ vars.ORGANIZER_GUILD_ID }}
        run: |
          npm ci --ignore-scripts
          npm run register
